# Builds the static site and publishes it to GitHub Pages: on pushes to main, by hand, and when an
# Octet release is published (the octet repo sends "octet-release"), so the version shown stays current.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [octet-release]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4          # version from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # base_path is "/octet-web" on github.io, "" once a custom domain is set
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }}   # for the release lookup, so it isn't rate-limited
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
